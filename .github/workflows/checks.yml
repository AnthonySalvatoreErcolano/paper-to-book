name: checks
# Runs each book's computational checks (sympy etc.) and records the results.
on:
  push:
    paths: ["books/*/checks/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-writes, cancel-in-progress: false }
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/p2b.py checks --all
      - name: Commit reports
        run: |
          git config user.name "paper-to-book bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- books
          git diff --cached --quiet || git commit -m "checks: results"
          git pull --rebase && git push
