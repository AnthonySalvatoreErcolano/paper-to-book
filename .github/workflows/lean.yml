name: lean
# Builds every book's Lean files against mathlib and records which names and files check.
on:
  push:
    paths: ["lean/**", "books/*/chapters/**", "books/*/map.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-writes, cancel-in-progress: false }
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}
      - name: Generate name checks
        run: python pipeline/p2b.py lean-names --all
      - name: Fetch mathlib and its prebuilt cache
        working-directory: lean
        run: |
          lake update mathlib || true
          lake exe cache get
      - name: Build
        working-directory: lean
        run: lake build 2>&1 | tee build.log || true
      - name: Report
        run: python pipeline/p2b.py lean-report --log lean/build.log
      - name: Commit reports
        run: |
          git config user.name "paper-to-book bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- books lean ':!lean/.lake' ':!lean/build.log'
          git diff --cached --quiet || git commit -m "lean: verification report"
          git pull --rebase && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lean-build-log, path: lean/build.log }
